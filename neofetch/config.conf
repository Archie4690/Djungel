# See this wiki page for more info:
# https://github.com/dylanaraps/neofetch/wiki/Customizing-Info
print_info() {
    info title
    info underline
    prin
    moods=(
      # absurdist frog philosophy
      "A pond is just a sky you can breathe in."
      "Time is a lily pad. Stop standing on it."
      "I have blinked slower than your entire career."
      "The fly does not know it is the fly."
      "All water remembers where it came from."
      "I sat on a rock for forty years. Good rock."
      "The moon pulls tides. The frog just watches."
      "Death is just a long dry season."
      "I ate a wasp once. Learned nothing."
      "Cold blood, warm conclusions."
      "The log is still. The log wins."
      "A frog has no ego. Only tongue."
      "Every lily pad ends eventually. Leap."
      "I have been still longer than you have existed."
      "The heron always comes. Be the mud."
      "Enlightenment smells like algae."
      "I am the patience you pretend to have."
      "The ripple doesn't ask if it was worth it."
      "Both of us are mostly water. Think about it."
      "Nothing matters. I still caught the fly."
      "The swamp doesn't care about your feelings."
      "A frog doesn't grind. A frog waits."
      "Still water runs deeper than your git log."
      "I have outlasted empires. And your uptime."
      "The oldest trick is patience. You lack it."
      "What is a terminal but a very dry pond?"
      "I metabolise slowly. So does your progress."
      "Some questions dissolve if you ignore them."
      "I emerged from the mud. So did everything."
      "To croak is to speak truth unfiltered."
      # brutal observations
      "GTX 1650 in 2025. Brave. Stupid. Brave."
      "Your GTX 1650 is actively embarrassed."
      "The 1650 called. It wants out."
      "5800X deserves better. You know this."
      "Still running a 1650. I respect the denial."
      "Hyprland: beautiful WM, middling GPU. Irony."
      "Corne keyboard. Six months to type hello."
      "Split keyboard. Split attention. Split ego."
      "You're building a keyboard instead of finishing."
      "The dissertation won't write itself. Trust me."
      "Chapter three still open. Frog watching."
      "Psychology degree. Still no self-awareness."
      "You study the mind. The frog studies you."
      "Rocket League ranked: unranked in real life."
      "You main Octane. I can tell."
      "Hamilton fan in a Verstappen era. Condolences."
      "Lewis is at Ferrari now. Adjust your grief."
      "Your Bambu prints faster than you graduate."
      "3D printing plastic. Very eco. Very you."
      "Python dev with a 1650. Checks out."
      "Data engineering: ETL is just fancy waiting."
      "Your pipeline fails more than your posture."
      "Kitty terminal, frog on screen. Hierarchy clear."
      "zsh with plugins you copied and don't understand."
      "You've rewritten your neovim config 11 times."
      "Hand-rolled config. Still defaults for LSP."
      "Terraria at 2am. Dissertation at 9am. Bold."
      "You play Terraria to avoid the thesis. I see."
      "The Bambu hums. You avoid your work. Same vibe."
      "Arch btw. We know. The frog knows. Everyone."
      "Hyprland animations on a 1650. Ambitious."
      "neofetch on every terminal open. We know."
      "Rice over functionality. Frog respects the choice."
      "Your Corne will be done when the thesis is done."
      "The dissertation has more layers than your PLA."
      "Your dotfiles repo has 47 unread issues. You."
      "Your GPU bottleneck has a name. It's the 1650."
      "F1 fan who watches the highlights. Not a sin."
      "Hamilton will be fine. Your GPA might not be."
      # coding / terminal / vim
      ":wq is the only prayer I respect."
      "vim or emacs. One is correct. Frog knows."
      "Your neovim config is longer than your thesis."
      "You left insert mode. Momentous occasion."
      "Buffer 14. Still open. Still ignored."
      "No LazyVim. Good. The frog respects effort."
      "Hand-rolled config. Hand-crafted pain. Beautiful."
      ":q! is the only honest exit."
      "Git blame exists. So does shame."
      "Your commit messages are crimes against logs."
      "main is not a branch name. It's a confession."
      "git push force. The frog has seen the aftermath."
      "You aliased ll to ls -la. Baby steps."
      "The terminal is the last honest place."
      "Python: whitespace as syntax. Frog respects it."
      "You pip installed in production. Admit it."
      "Your virtual env is chaos. venv, .venv, env..."
      "The frog has seen your requirements.txt. Brave."
      "Airflow DAG at 3am. Been there. I'm a frog."
      "Your zsh prompt took longer than the feature."
      "Oh My Zsh would've been faster. Just saying."
      "Plugin 34 in your nvim config does nothing."
      "You mapped leader to space. Correct. Frog nods."
      "Telescope is good. You still use :find. Ironic."
      "The LSP is red. You have chosen to ignore it."
      "Your function is 200 lines. Extract something."
      "Type hints in Python: a cry for help I respect."
      "SELECT * in production. The frog doesn't forget."
      "You wrote a regex. Now you have two problems."
      "README says coming soon. It is not coming."
      "Your TODO comments have TODO comments."
      "print() debugging in 2025. Eternal. Correct."
      "The pipeline is idempotent. You are not."
      "Oh, another rewrite. The sixth, I believe."
      "You've been in normal mode for 4 minutes."
      "Coc.nvim vs native LSP. The war never ends."
      "Neovim loads in 40ms. Your brain takes longer."
      "arch + hyprland + neovim. You're a type."
      "The semicolon was optional. You put it anyway."
      "Semicolons in Python. You're not in Kansas."
      # unhinged life advice
      "Drink water. I live in it. Trust me."
      "Sleep before 2am. The frog commands it."
      "Finish one thing. Just one. The frog begs."
      "Close 47 browser tabs. None spark joy."
      "Eat something that wasn't near a screen."
      "Touch grass. I live near grass. It's fine."
      "Log off Rocket League and open the thesis."
      "You know what you're avoiding. Do it."
      "The best config is the one you finish."
      "Submit the dissertation. I'll still be here."
      "Buy RAM before you buy filament."
      "The GPU upgrade fund exists. Use it."
      "Stop ricing, start sleeping."
      "Call your supervisor before she calls you."
      "Stretch your wrists. The Corne is not a cure."
      "Back up your dotfiles. Tonight."
      "The deadline is real. The frog is real. Both judge."
      "One more hour of Terraria is always a lie."
      "Don't push to main on a Friday. Or ever."
      "Merge conflicts are feedback from past-you."
      "If it worked yesterday, you changed something."
      "Document the weird parts now. Not later. Now."
      "The error message is telling you something."
      "Commit your work before the session dies."
      "Your future self is already disappointed."
      "Do the thing you've been putting off. Yes, that one."
      "Leap. Worst case you land in mud. I live there."
      "The cursor is blinking. That means start."
      "The dissertation chapter won't read itself. Go."
      "Log off. Lie down. Come back less stupid."
      # existential dread
      "The sun will expand. None of this matters."
      "You are a brief spike in entropy. So am I."
      "The terminal will outlast the operator."
      "Every keystroke is a prayer to nothing."
      "Your configs will die with your hardware."
      "The dot in dotfiles means hidden. Like your future."
      "One day the machine turns off. Doesn't come back."
      "All code rots. Yours just rots faster."
      "The repo will be archived. The frog remains."
      "Impermanence: a pond in drought understands."
      "You will be legacy code soon enough."
      "The universe compiled with no tests. We see."
      "There is no merge to main from this life."
      "I have watched civilisations build and collapse."
      "Tick. Tock. The dissertation clock."
      "Nothing persists. Not even the frog. But almost."
      "You are a process. You will be reaped."
      "The void compiles clean. Zero warnings."
      "Somewhere a heavier frog sits quieter than you."
      "You already know how this ends. Keep going."
      # frog-specific
      "I caught a fly today. You caught zero flies."
      "My eyes see 270 degrees. I see everything."
      "I am cold-blooded. I feel nothing. Unlike you."
      "The fly didn't see me coming. Be the frog."
      "I breathe through my skin. You can barely breathe."
      "Tadpole to frog. What's your arc?"
      "I have been a tadpole. Humbling. Useful."
      "The pond is full. The frog is content."
      "A heron took my friend. I remained. I adapted."
      "I don't sleep. I brumate. Know the difference."
      "I've eaten 10,000 flies. What have you done?"
      "Winter just is. The frog waits it out."
      "I live in a terminal. It's a very dry pond."
      "The log I sit on predates Linux by centuries."
      "My croak carries at frequencies you cannot hear."
      "Two eyes, four legs, zero excuses."
      "Amphibians predate your entire family tree."
      "I shed my skin sometimes. Consider it."
      "The fly was fast. I was patient. Patience wins."
      "I have no GPU. I have a tongue. Different tools."
      "A frog in the hand is worth two bugs in prod."
      "The heron circles. Deadlines circle. Same energy."
      "I am the apex predator of this config file."
      "Flies, flies, flies. Then nothing. Like prod."
      "I emerge when warm. You should too."
      "The pond has layers. So does your tech debt."
      "I have no eyelids. I see all. Even your shortcuts."
      "Green is not just a colour. It is a philosophy."
      "The first frog coded before code. In mud."
      "My metabolism is slow. My judgement is instant."
      "I live between water and land. Edge cases are home."
      "A frog doesn't panic. A frog recalculates."
      "My tongue is faster than your hotkey. Fact."
      "I've seen every version of you open this terminal."
      "Be pond. The pond is quiet. You are not pond."
      "I judge flies by how they move. Same for you."
      "Ancient frog. Ancient wisdom. Zero patience."
      "The spawn point is a swamp. Get used to it."
      "I am still here because I adapted. Have you?"
      "The frog has spoken. Now go do the thing."
    )

    frogstatus="${moods[$RANDOM % ${#moods[@]}]}"
prin '    _`O-O´_ ' "$frogstatus"
prin
    info "Memory" memory
    info "Uptime" uptime



}


# Title


# Hide/Show Fully qualified domain name.
#
# Default:  'off'
# Values:   'on', 'off'
# Flag:     --title_fqdn
title_fqdn="off"


# Kernel


# Shorten the output of the kernel function.
#
# Default:  'on'
# Values:   'on', 'off'
# Flag:     --kernel_shorthand
# Supports: Everything except *BSDs (except PacBSD and PC-BSD)
#
# Example:
# on:  '4.8.9-1-ARCH'
# off: 'Linux 4.8.9-1-ARCH'
kernel_shorthand="on"


# Distro


# Shorten the output of the distro function
#
# Default:  'off'
# Values:   'on', 'tiny', 'off'
# Flag:     --distro_shorthand
# Supports: Everything except Windows and Haiku
distro_shorthand="off"

# Show/Hide OS Architecture.
# Show 'x86_64', 'x86' and etc in 'Distro:' output.
#
# Default: 'on'
# Values:  'on', 'off'
# Flag:    --os_arch
#
# Example:
# on:  'Arch Linux x86_64'
# off: 'Arch Linux'
os_arch="off"


# Uptime


# Shorten the output of the uptime function
#
# Default: 'on'
# Values:  'on', 'tiny', 'off'
# Flag:    --uptime_shorthand
#
# Example:
# on:   '2 days, 10 hours, 3 mins'
# tiny: '2d 10h 3m'
# off:  '2 days, 10 hours, 3 minutes'
uptime_shorthand="tiny"


# Memory


# Show memory pecentage in output.
#
# Default: 'off'
# Values:  'on', 'off'
# Flag:    --memory_percent
#
# Example:
# on:   '1801MiB / 7881MiB (22%)'
# off:  '1801MiB / 7881MiB'
memory_percent="off"

# Change memory output unit.
#
# Default: 'mib'
# Values:  'kib', 'mib', 'gib'
# Flag:    --memory_unit
#
# Example:
# kib  '1020928KiB / 7117824KiB'
# mib  '1042MiB / 6951MiB'
# gib: ' 0.98GiB / 6.79GiB'
memory_unit="mib"


# Packages


# Show/Hide Package Manager names.
#
# Default: 'tiny'
# Values:  'on', 'tiny' 'off'
# Flag:    --package_managers
#
# Example:
# on:   '998 (pacman), 8 (flatpak), 4 (snap)'
# tiny: '908 (pacman, flatpak, snap)'
# off:  '908'
package_managers="on"


# Shell


# Show the path to $SHELL
#
# Default: 'off'
# Values:  'on', 'off'
# Flag:    --shell_path
#
# Example:
# on:  '/bin/bash'
# off: 'bash'
shell_path="off"

# Show $SHELL version
#
# Default: 'on'
# Values:  'on', 'off'
# Flag:    --shell_version
#
# Example:
# on:  'bash 4.4.5'
# off: 'bash'
shell_version="on"


# CPU


# CPU speed type
#
# Default: 'bios_limit'
# Values: 'scaling_cur_freq', 'scaling_min_freq', 'scaling_max_freq', 'bios_limit'.
# Flag:    --speed_type
# Supports: Linux with 'cpufreq'
# NOTE: Any file in '/sys/devices/system/cpu/cpu0/cpufreq' can be used as a value.
speed_type="bios_limit"

# CPU speed shorthand
#
# Default: 'off'
# Values: 'on', 'off'.
# Flag:    --speed_shorthand
# NOTE: This flag is not supported in systems with CPU speed less than 1 GHz
#
# Example:
# on:    'i7-6500U (4) @ 3.1GHz'
# off:   'i7-6500U (4) @ 3.100GHz'
speed_shorthand="off"

# Enable/Disable CPU brand in output.
#
# Default: 'on'
# Values:  'on', 'off'
# Flag:    --cpu_brand
#
# Example:
# on:   'Intel i7-6500U'
# off:  'i7-6500U (4)'
cpu_brand="on"

# CPU Speed
# Hide/Show CPU speed.
#
# Default: 'on'
# Values:  'on', 'off'
# Flag:    --cpu_speed
#
# Example:
# on:  'Intel i7-6500U (4) @ 3.1GHz'
# off: 'Intel i7-6500U (4)'
cpu_speed="on"

# CPU Cores
# Display CPU cores in output
#
# Default: 'logical'
# Values:  'logical', 'physical', 'off'
# Flag:    --cpu_cores
# Support: 'physical' doesn't work on BSD.
#
# Example:
# logical:  'Intel i7-6500U (4) @ 3.1GHz' (All virtual cores)
# physical: 'Intel i7-6500U (2) @ 3.1GHz' (All physical cores)
# off:      'Intel i7-6500U @ 3.1GHz'
cpu_cores="logical"

# CPU Temperature
# Hide/Show CPU temperature.
# Note the temperature is added to the regular CPU function.
#
# Default: 'off'
# Values:  'C', 'F', 'off'
# Flag:    --cpu_temp
# Supports: Linux, BSD
# NOTE: For FreeBSD and NetBSD-based systems, you'll need to enable
#       coretemp kernel module. This only supports newer Intel processors.
#
# Example:
# C:   'Intel i7-6500U (4) @ 3.1GHz [27.2°C]'
# F:   'Intel i7-6500U (4) @ 3.1GHz [82.0°F]'
# off: 'Intel i7-6500U (4) @ 3.1GHz'
cpu_temp="off"


# GPU


# Enable/Disable GPU Brand
#
# Default: 'on'
# Values:  'on', 'off'
# Flag:    --gpu_brand
#
# Example:
# on:  'AMD HD 7950'
# off: 'HD 7950'
gpu_brand="on"

# Which GPU to display
#
# Default: 'all'
# Values:  'all', 'dedicated', 'integrated'
# Flag:    --gpu_type
# Supports: Linux
#
# Example:
# all:
#   GPU1: AMD HD 7950
#   GPU2: Intel Integrated Graphics
#
# dedicated:
#   GPU1: AMD HD 7950
#
# integrated:
#   GPU1: Intel Integrated Graphics
gpu_type="all"


# Resolution


# Display refresh rate next to each monitor
# Default: 'off'
# Values:  'on', 'off'
# Flag:    --refresh_rate
# Supports: Doesn't work on Windows.
#
# Example:
# on:  '1920x1080 @ 60Hz'
# off: '1920x1080'
refresh_rate="off"


# Gtk Theme / Icons / Font


# Shorten output of GTK Theme / Icons / Font
#
# Default: 'off'
# Values:  'on', 'off'
# Flag:    --gtk_shorthand
#
# Example:
# on:  'Numix, Adwaita'
# off: 'Numix [GTK2], Adwaita [GTK3]'
gtk_shorthand="off"


# Enable/Disable gtk2 Theme / Icons / Font
#
# Default: 'on'
# Values:  'on', 'off'
# Flag:    --gtk2
#
# Example:
# on:  'Numix [GTK2], Adwaita [GTK3]'
# off: 'Adwaita [GTK3]'
gtk2="on"

# Enable/Disable gtk3 Theme / Icons / Font
#
# Default: 'on'
# Values:  'on', 'off'
# Flag:    --gtk3
#
# Example:
# on:  'Numix [GTK2], Adwaita [GTK3]'
# off: 'Numix [GTK2]'
gtk3="on"


# IP Address


# Website to ping for the public IP
#
# Default: 'http://ident.me'
# Values:  'url'
# Flag:    --ip_host
public_ip_host="http://ident.me"

# Public IP timeout.
#
# Default: '2'
# Values:  'int'
# Flag:    --ip_timeout
public_ip_timeout=2


# Desktop Environment


# Show Desktop Environment version
#
# Default: 'on'
# Values:  'on', 'off'
# Flag:    --de_version
de_version="on"


# Disk


# Which disks to display.
# The values can be any /dev/sdXX, mount point or directory.
# NOTE: By default we only show the disk info for '/'.
#
# Default: '/'
# Values:  '/', '/dev/sdXX', '/path/to/drive'.
# Flag:    --disk_show
#
# Example:
# disk_show=('/' '/dev/sdb1'):
#      'Disk (/): 74G / 118G (66%)'
#      'Disk (/mnt/Videos): 823G / 893G (93%)'
#
# disk_show=('/'):
#      'Disk (/): 74G / 118G (66%)'
#
disk_show=('/')

# Disk subtitle.
# What to append to the Disk subtitle.
#
# Default: 'mount'
# Values:  'mount', 'name', 'dir', 'none'
# Flag:    --disk_subtitle
#
# Example:
# name:   'Disk (/dev/sda1): 74G / 118G (66%)'
#         'Disk (/dev/sdb2): 74G / 118G (66%)'
#
# mount:  'Disk (/): 74G / 118G (66%)'
#         'Disk (/mnt/Local Disk): 74G / 118G (66%)'
#         'Disk (/mnt/Videos): 74G / 118G (66%)'
#
# dir:    'Disk (/): 74G / 118G (66%)'
#         'Disk (Local Disk): 74G / 118G (66%)'
#         'Disk (Videos): 74G / 118G (66%)'
#
# none:   'Disk: 74G / 118G (66%)'
#         'Disk: 74G / 118G (66%)'
#         'Disk: 74G / 118G (66%)'
disk_subtitle="mount"

# Disk percent.
# Show/Hide disk percent.
#
# Default: 'on'
# Values:  'on', 'off'
# Flag:    --disk_percent
#
# Example:
# on:  'Disk (/): 74G / 118G (66%)'
# off: 'Disk (/): 74G / 118G'
disk_percent="on"


# Song


# Manually specify a music player.
#
# Default: 'auto'
# Values:  'auto', 'player-name'
# Flag:    --music_player
#
# Available values for 'player-name':
#
# amarok
# audacious
# banshee
# bluemindo
# clementine
# cmus
# deadbeef
# deepin-music
# dragon
# elisa
# exaile
# gnome-music
# gmusicbrowser
# gogglesmm
# guayadeque
# io.elementary.music
# iTunes
# juk
# lollypop
# mocp
# mopidy
# mpd
# muine
# netease-cloud-music
# olivia
# playerctl
# pogo
# pragha
# qmmp
# quodlibet
# rhythmbox
# sayonara
# smplayer
# spotify
# strawberry
# tauonmb
# tomahawk
# vlc
# xmms2d
# xnoise
# yarock
music_player="auto"

# Format to display song information.
#
# Default: '%artist% - %album% - %title%'
# Values:  '%artist%', '%album%', '%title%'
# Flag:    --song_format
#
# Example:
# default: 'Song: Jet - Get Born - Sgt Major'
song_format="%artist% - %album% - %title%"

# Print the Artist, Album and Title on separate lines
#
# Default: 'off'
# Values:  'on', 'off'
# Flag:    --song_shorthand
#
# Example:
# on:  'Artist: The Fratellis'
#      'Album: Costello Music'
#      'Song: Chelsea Dagger'
#
# off: 'Song: The Fratellis - Costello Music - Chelsea Dagger'
song_shorthand="off"

# 'mpc' arguments (specify a host, password etc).
#
# Default:  ''
# Example: mpc_args=(-h HOST -P PASSWORD)
mpc_args=()


# Text Colors


# Text Colors
#
# Default:  'distro'
# Values:   'distro', 'num' 'num' 'num' 'num' 'num' 'num'
# Flag:     --colors
#
# Each number represents a different part of the text in
# this order: 'title', '@', 'underline', 'subtitle', 'colon', 'info'
#
# Example:
# colors=(distro)      - Text is colored based on Distro colors.
# colors=(4 6 1 8 8 6) - Text is colored in the order above.
colors=(2 1 1 2 2 1)


# Text Options


# Toggle bold text
#
# Default:  'on'
# Values:   'on', 'off'
# Flag:     --bold
bold="on"

# Enable/Disable Underline
#
# Default:  'on'
# Values:   'on', 'off'
# Flag:     --underline
underline_enabled="on"

# Underline character
#
# Default:  '-'
# Values:   'string'
# Flag:     --underline_char
underline_char="-"


# Info Separator
# Replace the default separator with the specified string.
#
# Default:  ':'
# Flag:     --separator
#
# Example:
# separator="->":   'Shell-> bash'
# separator=" =":   'WM = dwm'
separator=":"


# Color Blocks


# Color block range
# The range of colors to print.
#
# Default:  '0', '15'
# Values:   'num'
# Flag:     --block_range
#
# Example:
#
# Display colors 0-7 in the blocks.  (8 colors)
# neofetch --block_range 0 7
#
# Display colors 0-15 in the blocks. (16 colors)
# neofetch --block_range 0 15
block_range=(0 15)

# Toggle color blocks
#
# Default:  'on'
# Values:   'on', 'off'
# Flag:     --color_blocks
color_blocks="on"

# Color block width in spaces
#
# Default:  '3'
# Values:   'num'
# Flag:     --block_width
block_width=3

# Color block height in lines
#
# Default:  '1'
# Values:   'num'
# Flag:     --block_height
block_height=1

# Color Alignment
#
# Default: 'auto'
# Values: 'auto', 'num'
# Flag: --col_offset
#
# Number specifies how far from the left side of the terminal (in spaces) to
# begin printing the columns, in case you want to e.g. center them under your
# text.
# Example:
# col_offset="auto" - Default behavior of neofetch
# col_offset=7      - Leave 7 spaces then print the colors
col_offset="auto"

# Progress Bars


# Bar characters
#
# Default:  '-', '='
# Values:   'string', 'string'
# Flag:     --bar_char
#
# Example:
# neofetch --bar_char 'elapsed' 'total'
# neofetch --bar_char '-' '='
bar_char_elapsed="-"
bar_char_total="="

# Toggle Bar border
#
# Default:  'on'
# Values:   'on', 'off'
# Flag:     --bar_border
bar_border="on"

# Progress bar length in spaces
# Number of chars long to make the progress bars.
#
# Default:  '15'
# Values:   'num'
# Flag:     --bar_length
bar_length=15

# Progress bar colors
# When set to distro, uses your distro's logo colors.
#
# Default:  'distro', 'distro'
# Values:   'distro', 'num'
# Flag:     --bar_colors
#
# Example:
# neofetch --bar_colors 3 4
# neofetch --bar_colors distro 5
bar_color_elapsed="distro"
bar_color_total="distro"


# Info display
# Display a bar with the info.
#
# Default: 'off'
# Values:  'bar', 'infobar', 'barinfo', 'off'
# Flags:   --cpu_display
#          --memory_display
#          --battery_display
#          --disk_display
#
# Example:
# bar:     '[---=======]'
# infobar: 'info [---=======]'
# barinfo: '[---=======] info'
# off:     'info'
cpu_display="off"
memory_display="off"
battery_display="off"
disk_display="off"


# Backend Settings



image_backend="off"



# Ascii Options

ascii_distro="auto"

# Ascii Colors
#
# Default:  'distro'
# Values:   'distro', 'num' 'num' 'num' 'num' 'num' 'num'
# Flag:     --ascii_colors
#
# Example:
# ascii_colors=(distro)      - Ascii is colored based on Distro colors.
# ascii_colors=(4 6 1 8 8 6) - Ascii is colored using these colors.
ascii_colors=(2 1)

# Bold ascii logo
# Whether or not to bold the ascii logo.
#
# Default: 'on'
# Values:  'on', 'off'
# Flag:    --ascii_bold
ascii_bold="on"


# Image Options


# Image loop
# Setting this to on will make neofetch redraw the image constantly until
# Ctrl+C is pressed. This fixes display issues in some terminal emulators.
#
# Default:  'off'
# Values:   'on', 'off'
# Flag:     --loop
image_loop="off"

# Thumbnail directory
#
# Default: '~/.cache/thumbnails/neofetch'
# Values:  'dir'
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"

# Crop mode
#
# Default:  'normal'
# Values:   'normal', 'fit', 'fill'
# Flag:     --crop_mode
#
# See this wiki page to learn about the fit and fill options.
# https://github.com/dylanaraps/neofetch/wiki/What-is-Waifu-Crop%3F
crop_mode="normal"

# Crop offset
# Note: Only affects 'normal' crop mode.
#
# Default:  'center'
# Values:   'northwest', 'north', 'northeast', 'west', 'center'
#           'east', 'southwest', 'south', 'southeast'
# Flag:     --crop_offset
crop_offset="center"

# Image size
# The image is half the terminal width by default.
#
# Default: 'auto'
# Values:  'auto', '00px', '00%', 'none'
# Flags:   --image_size
#          --size
image_size="auto"

# Gap between image and text
#
# Default: '3'
# Values:  'num', '-num'
# Flag:    --gap
gap=3

# Image offsets
# Only works with the w3m backend.
#
# Default: '0'
# Values:  'px'
# Flags:   --xoffset
#          --yoffset
yoffset=0
xoffset=0

# Image background color
# Only works with the w3m backend.
#
# Default: ''
# Values:  'color', 'blue'
# Flag:    --bg_color
background_color=


# Misc Options

# Stdout mode
# Turn off all colors and disables image backend (ASCII/Image).
# Useful for piping into another command.
# Default: 'off'
# Values: 'on', 'off'
stdout="off"
