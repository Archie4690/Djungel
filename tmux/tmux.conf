# rEasy Reloads
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Rebind Command Prefix 
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Colours
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# QoL
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# Panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy-Paste
setw -g mode-keys vi
set -g mode-style "bg=#d79921,fg=#1c1c1c"
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'

# Sessionizer
bind f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind S run-shell "~/.local/bin/tmux-sessionizer ~/smc"
bind U run-shell "~/.local/bin/tmux-sessionizer ~/u"

# TMUX Bar

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=#1c1c1c,fg=#ebdbb2"

# Session name — matches #clock (blue block, dark text)
set -g status-left "#[bg=#458588,fg=#1c1c1c,bold] #S #[bg=#282828,fg=#458588]#[default]"
set -g status-left-length 30

# Inactive windows — matches #workspaces button.empty
set -g window-status-format "#[bg=#1c1c1c,fg=#504945] #I:#W "

# Active window — matches #workspaces button.active
set -g window-status-current-format "#[bg=#458588,fg=#1c1c1c,bold] #I:#W "

# Right side
set -g status-right "#{?pane_in_mode,#[bg=#d79921]#[fg=#1c1c1c,bold] COPY ,}#[bg=#282828,fg=#ebdbb2] %H:%M #[bg=#458588,fg=#1c1c1c,bold] %d %b "
set -g status-right-length 60

# Panes and messages
set -g pane-border-style "fg=#282828"
set -g pane-active-border-style "fg=#458588"
set -g message-style "bg=#458588,fg=#1c1c1c,bold"
set -g mode-style "bg=#d79921,fg=#1c1c1c"
