general {
    lock_cmd        = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# DVD screensaver — dismissed by any key, click or pointer movement
listener {
    timeout    = 180
    on-timeout = /home/archie/.config/hypr/screensaver/dvd-screensaver.sh
    on-resume  = pkill -f dvd-screensaver.py
}

# Lock a while after the screensaver kicks in
listener {
    timeout    = 1800
    on-timeout = loginctl lock-session
}

# Screens off last
listener {
    timeout    = 2400
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}
