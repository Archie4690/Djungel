# ── Retro CRT terminal lock — matches waybar / rofi / mako ──
$bg        = rgb(1c1c1c)
$panel     = rgb(282828)
$fg        = rgb(ebdbb2)
$muted     = rgb(928374)
$bevel     = rgb(504945)
$accent    = rgb(458588)
$accent_lt = rgb(83a598)
$red       = rgb(cc241d)
$font      = DepartureMono Nerd Font

# Scanline ground, same as the desktop
background {
    monitor =
    path = /home/archie/.config/hypr/wallpapers/scanlines-med-2560x1440.png
    color = $bg
}

general {
    hide_cursor = false
}

# ── Terminal panel: bevelled box behind the centre block ──


# Title bar of the "window"
shape {
    monitor =
    size = 620, 30
    color = $accent
    border_size = 0
    rounding = 0
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text =  SESSION LOCKED
    color = $bg
    font_size = 15
    font_family = $font
    position = 0, 250
    halign = center
    valign = center
}

# ── Clock ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $fg
    font_size = 74
    font_family = $font
    position = 0, 178
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a %d %b %Y")"
    color = $muted
    font_size = 16
    font_family = $font
    position = 0, 122
    halign = center
    valign = center
}


# ── Status block ──
label {
    monitor =
    text = cmd[update:30000] echo "$(/home/archie/.config/hypr/Scripts/lockinfo.sh host)"
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 78
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:30000] echo "$(/home/archie/.config/hypr/Scripts/lockinfo.sh kernel)"
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 56
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:10000] echo "$(/home/archie/.config/hypr/Scripts/lockinfo.sh uptime)"
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 34
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:10000] echo "$(/home/archie/.config/hypr/Scripts/lockinfo.sh memory)"
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 12
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:10000] echo "$(/home/archie/.config/hypr/Scripts/lockinfo.sh disk)"
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, -10
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:10000] echo "$(/home/archie/.config/hypr/Scripts/lockinfo.sh net)"
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, -32
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:10000] echo "$(/home/archie/.config/hypr/Scripts/lockinfo.sh corners)"
    color = $accent_lt
    font_size = 13
    font_family = $font
    position = 0, -54
    halign = center
    valign = center
}

# ── Prompt line ──
label {
    monitor =
    text = cmd[update:0] echo "$USER@$(uname -n):~$ unlock"
    color = $accent_lt
    font_size = 15
    font_family = $font
    position = 0, -90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 560, 46
    outline_thickness = 1
    outer_color = $bevel
    inner_color = $bg
    font_color = $fg
    font_family = $font
    check_color = $accent
    fail_color = $red
    capslock_color = rgb(d79921)
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##928374">password_</span>
    fail_text = <span foreground="##cc241d">ACCESS DENIED  ($ATTEMPTS)</span>
    position = 0, -132
    halign = center
    valign = center
}

# ── Status line at the bottom of the screen ──
label {
    monitor =
    text = cmd[update:2000] echo "$(/home/archie/.config/hypr/Scripts/whatsong.sh)"
    color = $muted
    font_size = 14
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
